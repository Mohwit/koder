[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "N"]
ignore = ["E501"]  # Ignore line too long

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
pretty = true

[tool.black]
line-length = 88
target-version = ["py310"]
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.venv
  | build
  | dist
)/
'''

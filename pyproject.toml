[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koder"
version = "1.0.0"
description = "AI-powered coding assistant with Claude-3.7-Sonnet"
authors = [{name = "Koder Team"}]
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "anthropic",
    "openai",
    "python-dotenv",
]

[project.scripts]
koder = "koder.cli:app"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "N"]
ignore = ["E501"]  # Ignore line too long

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
pretty = true

[tool.black]
line-length = 88
target-version = ["py310"]
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.venv
  | build
  | dist
)/
'''

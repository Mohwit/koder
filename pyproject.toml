[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "N"]
ignore = ["E501"]  # Ignore line too long

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
pretty = true

[tool.black]
line-length = 88
target-version = ["py310"]
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.venv
  | build
  | dist
)/
'''

# Minimal PEP 621 project metadata and CLI entry point
[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "koder"
version = "0.1.0"
description = "Koder: interactive coding assistant CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Koder" }
]

# Keep dependencies minimal here to avoid duplication with requirements.txt.
# Install deps via requirements.txt first when developing.
dependencies = []

[project.urls]
Homepage = "https://example.com/koder"

[project.scripts]
koder = "koder.main:main"

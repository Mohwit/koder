[project]
name = "koder"
version = "0.1.0"
description = "An intelligent CLI tool that understands your codebase, fixes bugs, refactors, and adds new features with simple prompts"
authors = [
    {name = "mohwits@gmail.com"}
]
license = {text = "Apache-2.0 license"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai (>=1.93.0,<2.0.0)",
    "rich (>=13.9.0,<14.0.0)",
    "click (>=8.1.0,<9.0.0)",
    "pydantic (>=2.11.7,<3.0.0)"
]

[project.scripts]
koder = "koder.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
